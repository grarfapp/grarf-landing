<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRARF LiveTrack | Live Sports Intelligence</title>
  <meta name="description" content="Real-time GRARF. No RSS delays. Live moments. Cross-sport intelligence.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="grarf-logo-white.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="livetrack-social-card.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
      color: #b7cccc;
      background: #000;
    }

    a {
      color: #56f7ff;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .page {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 2.5rem) clamp(2.5rem, 6vw, 4rem);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.875rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #1b2b2b;
    }

    .top-bar-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .top-bar-logo {
      width: 28px;
      height: 28px;
      opacity: 0.92;
    }

    .top-bar-meta {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6f8585;
    }

    .top-bar-nav {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8aa8a8;
    }

    .terminal-header {
      padding: 1.25rem 0 1rem;
      border-bottom: 2px solid rgba(86, 247, 255, 0.22);
      margin-bottom: 0;
    }

    .terminal-kicker {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #6f8585;
      margin-bottom: 0.625rem;
    }

    .terminal-title {
      font-size: clamp(1.125rem, 3.2vw, 1.625rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      line-height: 1.25;
      text-transform: uppercase;
      color: #f0f6f6;
    }

    .terminal-status {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-top: 0.875rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(27, 43, 43, 0.95);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6f8585;
    }

    .terminal-status span strong {
      color: #8aa8a8;
      font-weight: 500;
    }

    .feed-shell {
      border: 1px solid #1b2b2b;
      border-top: none;
      background: rgba(5, 8, 8, 0.72);
      box-shadow: inset 0 1px 0 rgba(86, 247, 255, 0.06);
    }

    .feed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.5rem 0.875rem;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6f8585;
      background: #030606;
      border-bottom: 1px solid #1b2b2b;
    }

    .feed-toolbar-label {
      color: #56f7ff;
    }

    .feed-list {
      list-style: none;
    }

    .feed-item {
      display: grid;
      grid-template-columns: 4.75rem 4.5rem 1fr;
      gap: 0.75rem 1rem;
      align-items: baseline;
      padding: 0.625rem 0.875rem;
      border-bottom: 1px solid rgba(27, 43, 43, 0.85);
    }

    .feed-item:last-child {
      border-bottom: none;
    }

    .feed-item:hover {
      background: rgba(86, 247, 255, 0.03);
    }

    .feed-time {
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #8aa8a8;
      white-space: nowrap;
    }

    .feed-type {
      display: inline-block;
      padding: 1px 6px;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid rgba(27, 43, 43, 0.95);
      background: #050a0a;
      white-space: nowrap;
    }

    .feed-type--social {
      color: #c4b5fd;
      border-color: rgba(196, 181, 253, 0.25);
    }

    .feed-type--news {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.25);
    }

    .feed-type--video {
      color: #56f7ff;
      border-color: rgba(86, 247, 255, 0.3);
    }

    .feed-body {
      font-size: 12px;
      line-height: 1.5;
      color: #c9dddd;
      letter-spacing: 0.02em;
    }

    .feed-placeholder-note {
      padding: 0.75rem 0.875rem;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6f8585;
      border-top: 1px dashed rgba(27, 43, 43, 0.95);
      background: rgba(3, 6, 6, 0.55);
    }

    .waitlist {
      margin-top: 2rem;
      padding: 1.5rem 1.25rem;
      text-align: center;
      border: 1px solid rgba(86, 247, 255, 0.18);
      background: linear-gradient(180deg, rgba(86, 247, 255, 0.04) 0%, rgba(5, 8, 8, 0.9) 100%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
    }

    .waitlist-title {
      font-size: clamp(0.95rem, 2.5vw, 1.125rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f0f6f6;
      margin-bottom: 0.75rem;
    }

    .waitlist-copy {
      max-width: 36rem;
      margin: 0 auto 1.125rem;
      font-size: 11px;
      line-height: 1.65;
      letter-spacing: 0.04em;
      color: #8aa8a8;
    }

    .waitlist-cta {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(86, 247, 255, 0.95);
      background: #050a0a;
      border: 1px solid rgba(86, 247, 255, 0.45);
      cursor: default;
    }

    @media (max-width: 560px) {
      .feed-item {
        grid-template-columns: 4.5rem 1fr;
        grid-template-rows: auto auto;
      }

      .feed-type {
        grid-column: 1;
      }

      .feed-body {
        grid-column: 1 / -1;
        padding-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="top-bar-brand">
        <img class="top-bar-logo" src="grarf-logo-white.svg" width="28" height="28" alt="">
        <span class="top-bar-meta">GRARF · LiveTrack</span>
      </div>
      <nav class="top-bar-nav" aria-label="Site">
        <a href="index.html">← /home</a>
      </nav>
    </header>

    <div class="terminal-header">
      <p class="terminal-kicker">Live Sports Intelligence Terminal</p>
      <h1 class="terminal-title">GRARF Live Sports Intelligence</h1>
      <div class="terminal-status" aria-hidden="true">
        <span data-livetrack-feed><strong>Feed</strong> Standby</span>
        <span data-livetrack-latency><strong>Latency</strong> —</span>
        <span><strong>Markets</strong> All Sports</span>
      </div>
    </div>

    <section class="feed-shell" aria-label="LiveTrack social feed">
      <div id="livetrack-social-feed" class="social-feed-panel font-mode-ibm">
        <div class="social-feed-header">
          <div class="social-feed-header-top">
            <div class="social-feed-header-meta">
              <span class="social-feed-label">WIRE · LIVE INTEL</span>
              <p class="social-feed-sync" id="livetrack-social-sync"></p>
            </div>
            <div class="social-feed-header-actions">
              <div class="social-feed-font-mode" role="group" aria-label="Font mode">
                <span class="social-feed-font-mode-label">FONT</span>
                <button type="button" class="social-feed-font-mode-btn" data-font-mode="jetbrains">
                  JETBRAINS
                </button>
                <button type="button" class="social-feed-font-mode-btn is-active" data-font-mode="ibm">
                  IBM
                </button>
                <button type="button" class="social-feed-font-mode-btn" data-font-mode="sharetech">
                  SHARETECH
                </button>
              </div>
              <div class="social-feed-size-mode" role="group" aria-label="Font size">
                <span class="social-feed-font-mode-label">SIZE</span>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="12">12</button>
                <button type="button" class="social-feed-size-mode-btn is-active" data-font-size="16">16</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="20">20</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="24">24</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="28">28</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="32">32</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="36">36</button>
                <button type="button" class="social-feed-size-mode-btn" data-font-size="40">40</button>
              </div>
              <button type="button" class="social-feed-refresh" id="livetrack-social-refresh">REFRESH</button>
            </div>
          </div>
          <div class="social-feed-color-row" role="group" aria-label="Font colors">
            <span class="social-feed-font-mode-label">COLOR</span>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="body">BODY·DEF</button>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="source">SRC·DEF</button>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="meta">META·DEF</button>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="author">AUTH·DEF</button>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="accent">ACCNT·DEF</button>
            <button type="button" class="social-feed-color-mode-btn" data-color-role="cursor">CRSR·DEF</button>
          </div>
        </div>
        <div class="social-feed-scroll" id="livetrack-social-feed-scroll">
          <ul class="social-feed-list" id="livetrack-social-feed-list" aria-label="Live wire feed"></ul>
          <button type="button" class="social-feed-new-items" id="livetrack-new-items" hidden>
            NEW ITEMS ↓
          </button>
        </div>
      </div>
    </section>

    <section class="waitlist" aria-labelledby="waitlist-heading">
      <h2 class="waitlist-title" id="waitlist-heading">Get real-time GRARF.</h2>
      <p class="waitlist-copy">
        No RSS delays. Live moments. Cross-sport intelligence.
      </p>
      <span class="waitlist-cta" role="button" aria-disabled="true">Join the waitlist</span>
    </section>
  </div>
  <script src="livetrack-social-ingest.js"></script>
  <script src="livetrack-feed-reveal.js"></script>
  <script src="livetrack-font-mode.js"></script>
  <script src="livetrack-font-size.js"></script>
  <script src="livetrack-font-color.js"></script>
  <script src="livetrack-social-card.js"></script>
</body>
</html>

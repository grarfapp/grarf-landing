<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRARF Extension</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="grarf-favicon-black.png" type="image/png" />
    <script type="module" src="./assets/extension-BJDhrpxp.js?v=1793397914748"></script>
    <link rel="stylesheet" href="./assets/extension-CngPAH-v.css?v=1793397914748">
  </head>
  <body>
    <div class="grarf-extension-web-preview" data-grarf-extension-web-preview-shell>
      <div class="grarf-extension-web-preview-panel" data-grarf-extension-web-preview-panel>
        <div id="root"></div>
      </div>
      <aside class="grarf-extension-web-preview-brand" aria-label="GRARF">
        <div class="grarf-extension-web-preview-explainer-stack">
          <div
            class="grarf-extension-web-preview-explainer-logo"
            data-grarf-extension-web-preview-brand-logo
          ></div>
          <div class="grarf-extension-web-preview-explainer-body">
            <div class="grarf-extension-web-preview-notice">
              <svg
                class="grarf-extension-web-preview-notice-icon"
                width="22"
                height="22"
                viewBox="0 0 22 22"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="9.25" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M11 10v5.5M11 7.25h.01"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
              </svg>
              <p class="grarf-extension-web-preview-notice-text">
                <strong>Test drive the GRARF extension.</strong> This web preview opens everything in
                new tabs. Download the extension to get the full experience: everything in one tab and
                the side panel always there as you browse.
              </p>
            </div>
          </div>
          <div class="grarf-extension-web-preview-cta-block">
            <a
              class="grarf-extension-web-preview-cta"
              href="https://chromewebstore.google.com/search/GRARF"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                class="grarf-extension-web-preview-cta-icon"
                src=""
                alt=""
                width="22"
                height="22"
                decoding="async"
              />
              <span class="grarf-extension-web-preview-cta-label">Get GRARF extension</span>
              <span class="grarf-extension-web-preview-cta-arrow" aria-hidden="true">→</span>
            </a>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
